# Example Portfolio: 100% Pure XEQT Across Accounts
# XEQT is automatically decomposed into America (US) (~45%), Canada (~26%), Europe/Asia (EAFE) (~24%), and Emerging Markets (~5%).
name: "Demo: Pure XEQT"
amount_to_buy: 0.0

strategy:
  mode: hierarchical
  categories:
    "Cash and Bonds": 0.00
    "Stocks": 1.00
  category_splits:
    "Cash and Bonds":
      "GICs/Bonds": 1.00
    "Stocks":
      "America (US)": 0.4512
      "Canada": 0.2569
      "Europe/Asia (EAFE)": 0.2419
      "Emerging Markets": 0.0500
  notes:
    - "100% all-equity one-ticket ETF strategy using XEQT across TFSA, RRSP, and Non-registered accounts."

holdings:
  - account: TFSA
    symbol: XEQT
    shares: 3200
    rebalance_divisions: ["America (US)", "Canada", "Europe/Asia (EAFE)", "Emerging Markets"]

  - account: RRSP
    symbol: XEQT
    shares: 5400

  - account: Non-registered
    symbol: XEQT
    shares: 1850
